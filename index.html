*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
html,body{height:100%;}
body{background:#fff;color:#111;overflow:hidden;}
#hdr{position:fixed;top:0;left:0;right:0;z-index:100;
background:#f4f4f4;border-bottom:1px solid #d7d7d7;
padding:5px 7px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
#topLine{display:flex;gap:7px;align-items:center;}
#scanInput{flex:1 1 auto;height:38px;border:2px solid #111;
background:#f7fbff;padding:0 10px;font-size:20px;font-weight:700;
outline:none;border-radius:3px;min-width:0;}
#taskCode{flex:0 0 auto;background:#111;color:#fff;font-size:28px;
font-weight:900;letter-spacing:.08em;padding:3px 10px;
border-radius:7px;cursor:pointer;line-height:32px;}
#meta{margin-top:5px;display:flex;gap:5px;align-items:center;
flex-wrap:wrap;}
#meta span{background:#f3f3f3;padding:3px 7px;border-radius:5px;
border:1px solid #ddd;font-size:14px;font-weight:800;}
#meta b{color:#0055cc;font-size:18px;}
#resetBtn{height:28px;padding:0 10px;border:1px solid #aaa;
background:#eee;font-size:14px;border-radius:5px;font-weight:800;}
#dupWarning{display:none;margin-top:4px;background:#ffdddd;
color:#a10000;padding:4px 7px;border-radius:4px;
font-size:13px;font-weight:900;}
#wrap{position:absolute;left:0;right:0;top:86px;bottom:0;
overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;}
table{border-collapse:collapse;width:100%;table-layout:fixed;
background:#fff;}
thead th{position:sticky;top:0;z-index:30;}
th{background:#f1f1f1;border:1px solid #d0d0d0;padding:2px 3px;
font-size:11px;height:22px;white-space:nowrap;text-align:left;}
td{border:1px solid #e1e1e1;padding:1px 3px;font-size:13px;
height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
table{border-collapse:collapse;width:auto;}
th.sc,td.sc{width:5px;padding:0;border:0;}
th.nr,td.nr{font-weight:900;white-space:nowrap;width:1%;}
th.brand,td.brand{white-space:nowrap;width:1%;}
th.loc,td.loc{white-space:nowrap;width:1%;}
th.klik,td.klik{width:90px;text-align:center;font-weight:900;}
tr.green>td:not(.klik):not(.sc){background:#b9f6ca;}
tr.red>td:not(.klik):not(.sc){background:#ffcdd2;}
tr.blue>td:not(.klik):not(.sc){background:#bbdefb;}
tr.yellow>td:not(.klik):not(.sc){background:#fff9c4;}
tr.turquoise>td:not(.klik):not(.sc){background:#b2ebf2;}
tr.orange>td:not(.klik):not(.sc){background:#f6be94;}
tr.purple>td:not(.klik):not(.sc){background:#d1c4e9;}
tr.sg>.sc{background:#00c853;}
tr.sr>.sc{background:#ff1744;}
tr.sb>.sc{background:#2979ff;}
tr.sy>.sc{background:#ffd600;}
tr.st>.sc{background:#00bcd4;}
tr.sp>.sc{background:#f59780;}
tr.sv>.sc{background:#7c4dff;}
tr.dR>.sc{border-bottom:4px solid #ff1744;}
tr.dY>.sc{border-bottom:4px solid #ffd600;}
tr.green.found>td:not(.klik):not(.sc),
tr.green.match>td:not(.klik):not(.sc){background:#00c853!important;
color:#fff;font-weight:900;}
tr.red.found>td:not(.klik):not(.sc),
tr.red.match>td:not(.klik):not(.sc){background:#ff1744!important;
color:#fff;font-weight:900;}
tr.blue.found>td:not(.klik):not(.sc),
tr.blue.match>td:not(.klik):not(.sc){background:#2979ff!important;
color:#fff;font-weight:900;}
tr.yellow.found>td:not(.klik):not(.sc),
tr.yellow.match>td:not(.klik):not(.sc){background:#ffd600!important;
color:#000;font-weight:900;}
tr.turquoise.found>td:not(.klik):not(.sc),
tr.turquoise.match>td:not(.klik):not(.sc){background:#00bcd4!important;
color:#fff;font-weight:900;}
tr.orange.found>td:not(.klik):not(.sc),
tr.orange.match>td:not(.klik):not(.sc){background:#f59780!important;
color:#fff;font-weight:900;}
tr.purple.found>td:not(.klik):not(.sc),
tr.purple.match>td:not(.klik):not(.sc){background:#7c4dff!important;
color:#fff;font-weight:900;}
td.hitGreen{background:#00c853;color:#fff;font-weight:900;}
td.hitRed{background:#ff1744;color:#fff;font-weight:900;}
td.hitBlue{background:#2979ff;color:#fff;font-weight:900;}
td.hitYellow{background:#ffd600;color:#000;font-weight:900;}
td.hitTurquoise{background:#00bcd4;color:#fff;font-weight:900;}
td.hitOrange{background:#f59780;color:#fff;font-weight:900;}
td.hitPurple{background:#7c4dff;color:#fff;font-weight:900;}
td.noHit{background:#f5f5f5;color:#555;}
td.klik{position:relative;}
td.klik::before{content:'';position:absolute;left:0;top:0;bottom:0;
width:8px;background:var(--dup-color,transparent);}
td.klik::after{content:'';position:absolute;left:8px;top:0;bottom:0;
width:8px;background:var(--dest-color,transparent);}
td.dupScan{background:#fce4ec!important;color:#880e4f;
font-weight:900;}
#exportText{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;}

  let n = 0;
  scans.forEach(s => { if (norm(s.nr) === k) n++; });
  return n;
}
function updateCountersFast() {
  let hits = 0;
  scans.forEach(s => { if (s && s.hit && !s.dup) hits++; });
  document.getElementById('allCount').textContent = DATA.length;
  document.getElementById('scanCount').textContent = scans.length;
  document.getElementById('hitCount').textContent = hits;
}
function ensureScanRow(i) {
  let cell = tb.querySelector('[data-i="' + i + '"]');
  if (cell) return cell;
  const tr = document.createElement('tr');
  tr.innerHTML = '<td class="sc"></td>' +
    '<td class="nr"></td>' +
    '<td class="brand"></td>' +
    '<td class="loc"></td>' +
    '<td class="klik" data-i="' + i + '"></td>';
  tb.appendChild(tr);
  return tr.querySelector('[data-i="' + i + '"]');
}
function updateScanCell(i) {
  const s = scans[i];
  if (!s) return;
  const cell = ensureScanRow(i);
  const match = findFirstMatch(s.nr);
  const isDup = scanDupCount(s.nr) > 1;
  let cls = 'klik ';
  if (isDup) cls += 'dupScan';
  else cls += match ? hitCls(color(match)) : 'noHit';
  cell.className = cls;
  if (isDup && match) cell.style.setProperty('--dup-color', marker(color(match)));
  else cell.style.removeProperty('--dup-color');
  const destHexVal = match ? destHex(destStripe(match)) : '';
  if (destHexVal) cell.style.setProperty('--dest-color', destHexVal);
  else cell.style.removeProperty('--dest-color');
  cell.textContent = s.nr || '';
}
function updateSameScanCells(v) {
  const k = norm(v);
  scans.forEach((s, i) => { if (norm(s.nr) === k) updateScanCell(i); });
}
function markFoundRows(v) {
  const k = norm(v);
  tb.querySelectorAll('tr[data-n="' + k + '"]').forEach(tr => {
    tr.classList.add('found');
  });
}
function updateAfterScan(v) {
  wrap.style.top = document.getElementById('dupWarning').style.display ===
    'block' ? '112px' : '86px';
  markFoundRows(v);
  updateSameScanCells(v);
  updateCountersFast();
  const el = tb.querySelector('[data-i="' + (scans.length - 1) + '"]');
  if (el) el.scrollIntoView({block: 'center', inline: 'nearest'});
  setTimeout(() => scanInput.focus(), 10);
}
function saveLocal() {
  try {
    localStorage.setItem(scanKey(), JSON.stringify(scans));
  } catch (_) {}
}
function loadLocal() {
  try {
    const saved = JSON.parse(localStorage.getItem(scanKey()) || '[]');
    if (Array.isArray(saved)) {
      scans.length = 0;
      counts.clear();
      saved.forEach(s => {
        if (s && s.nr) {
          scans.push(s);
          counts.set(norm(s.nr), (counts.get(norm(s.nr)) || 0) + 1);
        }
      });
    }
  } catch (_) {}
}
function processScan() {
  const v = norm(scanInput.value);
  if (!v) return;
  scanInput.value = '';
  const count = (counts.get(v) || 0) + 1;
  counts.set(v, count);
  const hit = byNr.has(v);
  const isDup = count > 1;
  const row = {
    kind: 'scan',
    id: makeId('scan'),
    nr: v,
    dup: isDup,
    hit,
    ts: new Date().toISOString(),
    task_version: taskVersion,
    task_code: taskCode,
    device_id: terminalId,
    employee: employeeName,
    timer_session_id: timerSessionId,
    timer_boot_id: TIMER_BOOT_ID,
    elapsed_ms: elapsedMs()
  };
  scans.push(row);
  remember(row);
  saveLocal();
  if (isDup && hit) vibrateDup();
  else if (hit) vibrateHit();
  document.getElementById('dupWarning').style.display =
    isDup ? 'block' : 'none';
  updateAfterScan(v);
}
function encodeDetails(v) {
  try {
    return encodeURIComponent(JSON.stringify(v || {}));
  } catch (_) {
    return '%7B%7D';
  }
}
function exportRows() {
  const m = new Map();
  function add(e) {
    if (!e) return;
    const k = (e.kind || 'scan') + '|' +
      (e.id || ((e.nr || e.event || '') + '|' + (e.ts || '')));
    if (!m.has(k)) m.set(k, e);
  }
  flushJournal();
  getJournalCache().forEach(add);
  scans.forEach(add);
  return Array.from(m.values()).sort((a, b) =>
    String(a.ts || '').localeCompare(String(b.ts || '')));
}
function doExport() {
  logEvent('manual_export', {trigger: 'task_code_long_press'});
  const rows = exportRows();
  if (!rows.length) {
    alert('empty');
    return;
  }
  const lines = rows.map(e => {
    if ((e.kind || 'scan') === 'event') {
      return [
        '@EVENT', e.event || 'event', e.ts || '',
        e.task_version || taskVersion, e.task_code || taskCode,
        e.id || '', e.employee || employeeName, e.device_id || terminalId,
        e.timer_session_id || timerSessionId,
        e.timer_boot_id || TIMER_BOOT_ID,
        e.elapsed_ms || 0, encodeDetails(e.details || {})
      ].join('|');
    }
    return [
      e.nr, e.ts || '', e.dup ? 'DUP' : (e.hit ? 'HIT' : 'MISS'),
      e.task_version || taskVersion, e.task_code || taskCode,
      e.id || '', e.employee || employeeName, e.device_id || terminalId,
      e.timer_session_id || timerSessionId,
      e.timer_boot_id || TIMER_BOOT_ID, e.elapsed_ms || 0
    ].join('|');
  }).join('\n');
  const txt = terminalId + '|' + employeeName + '|mixed|' + taskCode +
    '|OOS_EXPORT_V2|' + new Date().toISOString() + '\n' + lines;
  document.getElementById('exportText').value = txt;
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], {
      type: 'text/plain;charset=utf-8'
    }));
    a.download = 'oos_macro_' + taskCode + '.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    alert('Eksport gotowy: ' + rows.length + ' zapisów');
  } catch (_) {
    prompt('Kopiuj:', txt);
  }
}
function setupCodeExport() {
  let timer = null;
  let fired = false;
  function start(e) {
    fired = false;
    if (e && e.type === 'touchstart') e.preventDefault();
    clearTimeout(timer);
    timer = setTimeout(() => {
      fired = true;
      const p = prompt('nazmi cancel i ne liz siudy');
      if (p !== null && String(p).trim() === String(taskCode).trim()) {
        doExport();
      } else if (p !== null) {
        alert('zapraszam do spm');
      }
    }, 1200);
  }
  function stop() {
    clearTimeout(timer);
  }
  taskCodeBox.addEventListener('mousedown', start);
  taskCodeBox.addEventListener('touchstart', start, {passive: false});
  ['mouseup', 'mouseleave', 'touchend', 'touchcancel']
    .forEach(ev => taskCodeBox.addEventListener(ev, stop));
  taskCodeBox.addEventListener('click', e => {
    if (fired) e.preventDefault();
  });
}
function clearAll() {
  if (!confirm('vsio udalit?')) return;
  logEvent('visible_log_reset', {});
  scans.length = 0;
  counts.clear();
  document.getElementById('dupWarning').style.display = 'none';
  try {
    localStorage.removeItem(scanKey());
  } catch (_) {}
  render(false);
  scanInput.focus();
}
let clearTimer = null;
scanInput.addEventListener('input', () => {
  clearTimeout(clearTimer);
  if (scanInput.value.trim()) {
    clearTimer = setTimeout(processScan, 220);
  }
});
scanInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === 'Tab') {
    e.preventDefault();
    clearTimeout(clearTimer);
    setTimeout(processScan, 10);
  }
});
window.addEventListener('pagehide', () => {
  logEvent('page_hide', {});
  flushJournal();
});
document.addEventListener('visibilitychange', () => {
  logEvent(document.hidden ? 'page_hidden' : 'page_visible', {});
  if (document.hidden) flushJournal();
});
document.getElementById('resetBtn').addEventListener('click', clearAll);
document.addEventListener('click', e => {
  if (e.target.closest('#taskCode') || e.target.closest('#resetBtn')) return;
  scanInput.focus();
});
setupCodeExport();
loadLocal();
logEvent('page_open', {href: location.href, ua: navigator.userAgent || ''});
logEvent('task_loaded', {total: DATA.length, unique: byNr.size});
render(false);
setTimeout(() => scanInput.focus(), 30);
</script>
