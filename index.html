#net{font-weight:900;}

#app.anim.s-hit{animation:flash .45s ease-out;}
#app.anim #icon,#app.anim #big{animation:pop .28s ease-out;}
#app.anim.s-miss #card,#app.anim.s-dup #card{animation:shake .4s;}
#foundCnt.bump{display:inline-block;animation:bump .35s ease-out;}

  const f = updateCounters(kind === 'hit');
  if (kind === 'hit' && f >= byNr.size && byNr.size > 0) {
    labelEl.textContent = 'KONIEC! WSZYSTKO ZNALEZIONE';
    vib([100, 80, 100, 80, 300]);
  }
}
let buf = '', bufTimer = null;
function flushBuf() {
  clearTimeout(bufTimer);
  const b = buf; buf = '';
  if (b) handleCode(b);
}
document.addEventListener('keydown', e => {
  if (!started || modalOpen) return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === 'Enter' || e.key === 'Tab') {
    e.preventDefault();
    clearTimeout(inpTimer); if (buf) flushBuf(); else if (cap.value) { const t = cap.value; cap.value = ''; handleCode(t); }
    return;
  }
  if (e.key && e.key.length === 1 && document.activeElement !== cap) {
    e.preventDefault();
    buf += e.key;
    clearTimeout(bufTimer);
    bufTimer = setTimeout(flushBuf, 220);
  }
}, true);
let inpTimer = null;
document.addEventListener('input', e => {
  if (e.target.id !== 'cap') return;
  gotInput = true; clearTimeout(deadT);
  clearTimeout(inpTimer);
  if (cap.value.trim()) inpTimer = setTimeout(() => { const t = cap.value; cap.value = ''; handleCode(t); }, 220);
}, true);
function keepFocus() {
  if (!started || modalOpen) return;
  if (document.activeElement !== cap) { focusCap(); }
}
setInterval(keepFocus, 400);
document.addEventListener('focusout', e => { if (e.target.id === 'cap') setTimeout(keepFocus, 20); });
window.addEventListener('focus', () => setTimeout(keepFocus, 20));
document.addEventListener('mousedown', e => { if (started && !modalOpen && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) e.preventDefault(); }, true);
function focusCap() {
  try {
    cap.setAttribute('readonly', 'readonly');
    cap.focus({preventScroll: true});
    setTimeout(() => { try { cap.removeAttribute('readonly'); } catch (_) {} }, 60);
  } catch (_) {}
}
let gotInput = true, deadT = null;
function reviveCap() {
  const t = cap.value; buf = ''; clearTimeout(bufTimer); clearTimeout(inpTimer);
  const n = cap.cloneNode(false); n.value = '';
  cap.parentNode.replaceChild(n, cap); cap = n;
  focusCap();
  if (t && t.trim()) handleCode(t);
}
document.addEventListener('keydown', e => {
  if (!started || modalOpen || e.key !== 'Unidentified') return;
  gotInput = false; clearTimeout(deadT);
  deadT = setTimeout(() => { if (!gotInput) { logEvent('cap_dead', {active: (document.activeElement && document.activeElement.id) || '', hf: document.hasFocus()}); reviveCap(); } }, 600);
}, true);
let modalOpen = false, pinCb = null, resetT = null, resetArmed = false;
function toast(t) {
  const el = $('toast'); el.textContent = t; el.style.display = 'block';
  clearTimeout(el._t); el._t = setTimeout(() => { el.style.display = 'none'; }, 2500);
}
function refocus() {
  buf = ''; clearTimeout(bufTimer); clearTimeout(inpTimer); cap.value = '';
  try { cap.blur(); } catch (_) {}
  setTimeout(() => { if (started && !modalOpen) { focusCap(); } }, 40);
}
function askCode(cb) {
  pinCb = cb; modalOpen = true; $('pinIn').value = ''; $('pin').style.display = 'flex';
  setTimeout(() => { try { $('pinIn').focus(); } catch (_) {} }, 60);
}
function closeCode(val) {
  const cb = pinCb; pinCb = null; modalOpen = false; $('pin').style.display = 'none';
  try { $('pinIn').blur(); } catch (_) {}
  setTimeout(refocus, 60);
  if (cb && val !== null) cb(val);
}
$('pinOk').addEventListener('click', () => closeCode($('pinIn').value));
$('pinNo').addEventListener('click', () => closeCode(null));
$('pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); closeCode($('pinIn').value); } });
window.addEventListener('focus', () => setTimeout(refocus, 50));
document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(refocus, 50); });
let rawKeys = 0, lastHasFocus = true, lastIdleLog = 0, lastOddLog = 0;
function dbgUpdate() {
  const ok = document.hasFocus();
  $('dbg').textContent = 'k' + rawKeys + (ok ? '' : ' !F') + (started ? '' : ' !S');
}
document.addEventListener('keydown', e => {
  rawKeys++;
  const now = Date.now();
  if (!started && now - lastIdleLog > 10000) { lastIdleLog = now; logEvent('key_while_not_started', {}); }
  if (e.key && e.key.length > 1 && e.key !== 'Enter' && e.key !== 'Tab' && now - lastOddLog > 5000) {
    lastOddLog = now; logEvent('key_odd', {key: e.key, kc: e.keyCode});
  }
  dbgUpdate();
}, true);
document.addEventListener('input', e => { if (e.target.id === 'cap') { rawKeys++; dbgUpdate(); } }, true);
setInterval(() => {
  const f = document.hasFocus();
  if (f !== lastHasFocus) {
    lastHasFocus = f;
    logEvent(f ? 'win_focus' : 'win_blur', {active: (document.activeElement && document.activeElement.id) || ''});
  }
  dbgUpdate();
}, 1000);
let wl = null;
async function getWake() {
  try { if (navigator.wakeLock && started && !document.hidden) wl = await navigator.wakeLock.request('screen'); } catch (_) {}
}
function showUser() {
  $('userName').textContent = employeeName || '-';
  $('userTerm').textContent = terminalId ? 'T' + terminalId : '-';
}
function openStart() {
  started = false;
  startEl.style.display = 'flex';
  $('inName').value = employeeName; $('inTerm').value = terminalId;
  $('stCode').textContent = taskCode;
  $('stTotal').textContent = byNr.size + ' kartonow do znalezienia';
  $('stWarn').textContent = navigator.vibrate ? '' : 'Uwaga: ta przegladarka nie wspiera wibracji';
}
function goStart() {
  const n = $('inName').value.trim().replace(/\|/g, '/');
  const t = $('inTerm').value.trim().replace(/\|/g, '/');
  $('inName').classList.toggle('err', !n);
  $('inTerm').classList.toggle('err', !t);
  if (!n || !t) { vib(200); return; }
  const changed = (n !== employeeName || t !== terminalId);
  employeeName = n; terminalId = t;
  lsSet('oos_macro_user', n); lsSet('oos_macro_term', t);
  started = true;
  try { localStorage.setItem('oos_started_' + taskCode, '1'); } catch (_) {}
  startEl.style.display = 'none';
  vib(80);
  showUser();
  logEvent(changed ? 'user_set' : 'session_start', {name: n, terminal: t});
  getWake();
  keepFocus();
}
$('goBtn').addEventListener('click', goStart);
$('inName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('inTerm').focus(); } });
$('inTerm').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); goStart(); } });
$('user').addEventListener('click', () => { if (started) return; logEvent('user_change_open', {}); openStart(); });
function encodeDetails(v) {
  try { return encodeURIComponent(JSON.stringify(v || {})); } catch (_) { return '%7B%7D'; }
}
function exportRows() {
  const m = new Map();
  function add(e) {
    if (!e) return;
    const k = (e.kind || 'scan') + '|' + (e.id || ((e.nr || e.event || '') + '|' + (e.ts || '')));
    if (!m.has(k)) m.set(k, e);
  }
  flushJournal();
  getJournalCache().forEach(add);
  scans.forEach(add);
  return Array.from(m.values()).sort((a, b) => String(a.ts || '').localeCompare(String(b.ts || '')));
}
function doExport() {
  logEvent('manual_export', {trigger: 'task_code_long_press'});
  const rows = exportRows();
  if (!rows.length) { toast('pusto'); return; }
  const lines = rows.map(e => {
    if ((e.kind || 'scan') === 'event') {
      return [
        '@EVENT', e.event || 'event', e.ts || '',
        e.task_version || taskVersion, e.task_code || taskCode,
        e.id || '', e.employee || employeeName, e.device_id || terminalId,
        e.timer_session_id || timerSessionId, e.timer_boot_id || TIMER_BOOT_ID,
        e.elapsed_ms || 0, encodeDetails(e.details || {})
      ].join('|');
    }
    return [
      e.nr, e.ts || '', e.dup ? 'DUP' : (e.hit ? 'HIT' : 'MISS'),
      e.task_version || taskVersion, e.task_code || taskCode,
      e.id || '', e.employee || employeeName, e.device_id || terminalId,
      e.timer_session_id || timerSessionId, e.timer_boot_id || TIMER_BOOT_ID,
      e.elapsed_ms || 0
    ].join('|');
  }).join('\n');
  const txt = terminalId + '|' + employeeName + '|mixed|' + taskCode +
    '|OOS_EXPORT_V2|' + new Date().toISOString() + '\n' + lines;
  $('exportText').value = txt;
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], {type: 'text/plain;charset=utf-8'}));
    a.download = 'oos_' + String(terminalId).replace(/[^A-Za-z0-9_-]/g, '') + '_' + taskCode + '.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Eksport gotowy: ' + rows.length);
    setTimeout(refocus, 400); setTimeout(refocus, 1800);
  } catch (_) {
    toast('blad eksportu');
  }
}
function setupCodeExport() {
  let timer = null, fired = false;
  function start(e) {
    fired = false;
    if (e && e.type === 'touchstart') e.preventDefault();
    clearTimeout(timer);
    timer = setTimeout(() => {
      fired = true;
      askCode(p => {
        if (String(p).trim() === String(taskCode).trim()) doExport();
        else toast('zapraszam do spm');
      });
    }, 1200);
  }
  function stop() { clearTimeout(timer); }
  taskCodeBox.addEventListener('mousedown', start);
  taskCodeBox.addEventListener('touchstart', start, {passive: false});
  ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(ev => taskCodeBox.addEventListener(ev, stop));
  taskCodeBox.addEventListener('click', e => { if (fired) e.preventDefault(); });
}
function clearAll() {
  const b = $('resetBtn');
  if (!resetArmed) {
    resetArmed = true; b.textContent = 'POTWIERDZ?'; b.style.background = '#c62828';
    clearTimeout(resetT);
    resetT = setTimeout(() => { resetArmed = false; b.textContent = 'reset'; b.style.background = ''; }, 3000);
    return;
  }
  clearTimeout(resetT); resetArmed = false; b.textContent = 'reset'; b.style.background = '';
  logEvent('visible_log_reset', {});
  scans.length = 0; counts.clear(); histArr.length = 0;
  try { localStorage.removeItem(scanKey()); } catch (_) {}
  renderHist(); showIdle(); updateCounters(false);
  refocus();
}
$('resetBtn').addEventListener('click', clearAll);
function showNet() {
  const el = $('net');
  if (navigator.onLine === false) { el.textContent = 'OFFLINE - dziala, dane lokalnie'; el.className = 'off'; }
  else { el.textContent = 'online'; el.className = ''; }
}
window.addEventListener('online', () => { showNet(); logEvent('net_online', {}); });
window.addEventListener('offline', () => { showNet(); logEvent('net_offline', {}); });
window.addEventListener('pagehide', () => { logEvent('page_hide', {}); flushJournal(); });
document.addEventListener('visibilitychange', () => {
  logEvent(document.hidden ? 'page_hidden' : 'page_visible', {});
  if (document.hidden) flushJournal(); else { getWake(); setTimeout(keepFocus, 50); }
});
setupCodeExport();
loadLocal();
showNet();
showUser();
showIdle();
updateCounters(false);
logEvent('page_open', {href: location.href, ua: navigator.userAgent || ''});
logEvent('task_loaded', {total: DATA.length, unique: byNr.size});
let resumed = false;
try { resumed = !!(employeeName && terminalId && localStorage.getItem('oos_started_' + taskCode)); } catch (_) {}
if (resumed) {
  started = true; startEl.style.display = 'none'; showUser();
  logEvent('session_resume', {}); keepFocus();
} else { openStart(); }
</script>
