function normNr(v){
  return String(v||'').trim().replace(/^'+/,'').replace(/\s+/g,'');

function escH(v){
  return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function softColor(hex,a){
  hex=String(hex||'#7c3aed').replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16);
  if(isNaN(n)) return 'rgba(124,58,237,'+(a||.22)+')';
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+(a||.22)+')';
}

function colorClass(d){
  if(!d) return '';
  var p=String(d.prio||'').toUpperCase();
  var t=String(d.notice||d.tsu||'').toUpperCase();
  var isPrio=p==='PRIO1'||p==='PRIORYTET 1';
  if(p==='BLOK'&&t.indexOf('MDTPUT')>=0) return 'green';
  if(isPrio&&t.indexOf('MDTPUT')>=0) return 'red';
  if(p==='BLOK'&&t.indexOf('RSORT')>=0) return 'blue';
  if(isPrio&&t.indexOf('RSORT')>=0) return 'yellow';
  if(p==='BLOK') return 'blue';
  if(isPrio) return 'yellow';
  return '';
}

function scanCellClass(scan,d){

function markerColor(d){

function renderTable(centerLast){
  const scans=orderedScans();
  const foundSet=new Set();
  scans.forEach(s=>{if(byNr.has(normNr(s.nr))) foundSet.add(normNr(s.nr));});
  const clickCounts=new Map();
  scans.forEach(s=>{const n=normNr(s.nr);clickCounts.set(n,(clickCounts.get(n)||0)+1);});
  foundUnique.clear();
  foundSet.forEach(nr=>foundUnique.add(nr));
  const rows=Math.max(DATA.length,scans.length,1);
  let html='';
  for(let i=0;i<rows;i++){
    const d=DATA[i]||null;
    const scan=scans[i]||null;
    const nr=d?normNr(d.nr):'';
    const base=d?colorClass(d):'';
    const rowFound=d&&foundSet.has(nr);
    const rowMatch=scan&&d&&normNr(scan.nr)===nr;
    const classes=[];
    if(base) classes.push(base,rowStripeClass(base));
    if(d&&d.source_color) classes.push('source-row');
    if(rowFound) classes.push('found');
    if(rowMatch) classes.push('match');
    const styles=[];
    if(d&&d.source_color){
      styles.push('--src-color:'+d.source_color);

    const visualDup=scan&&clickCounts.get(normNr(scan.nr))>1;
    const cellCls=scanCellClass(scan?Object.assign({},scan,{dup:visualDup}):null,matchData);
    let cellStyle='';

      cellStyle=' style="--src-color:'+matchData.source_color+';--src-found:'+(matchData.source_found||softColor(matchData.source_color,.48))+'"';

    html+='<tr class="'+classes.join(' ')+'"'+(styles.length?' style="'+styles.join(';')+'"':'')+'>'
      +'<td class="sc"></td>'
      +'<td class="nr">'+(d?escH(d.nr):'')+'</td>'
      +'<td class="brand">'+(d?escH(d.brand||''):'')+'</td>'

      +'<td class="klik '+cellCls+'"'+cellStyle+' data-click-idx="'+i+'">'+(scan?escH(scan.nr):'')+'</td>'
      +'</tr>';
  }

  if(centerLast&&lastClickCell) centerOnClickCell();
}

    const q=scanInput.value.trim();
    try{if(q) processScan(q);}
    finally{scanInput.value='';scanInput.focus();}
  }
});

function clearLog(){
  if(!confirm('Usunąć historię skanowania?')) return;
  logTerminalEvent('visible_log_reset',{device_id:deviceId,employee:employeeName});
  scanLog.length=0; scannedNrs.clear(); foundUnique.clear();
  try{localStorage.removeItem(scansStorageKey());}catch(_){}
  document.getElementById('scannedCount').textContent='0';
  document.getElementById('uniqueCount').textContent='0';
  document.getElementById('dupWarning').style.display='none';
  renderTable(false);
  scanInput.focus();
  scheduleSave();
}

function applyFilter(){
  scanInput.focus();
}

// LocalStorage persistence
function scheduleSave(){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(saveLocal,500);
}
function saveLocal(){
  try{localStorage.setItem(scansStorageKey(),JSON.stringify(scanLog));}catch(_){}
}
function loadLocal(){
  try{
    const seen=new Set();
    function keyOf(e){return (e&&e.id)||((e&&e.nr||'')+'|'+(e&&e.ts||'')+'|'+(e&&e.task_version||TASK_VERSION)+'|'+(e&&e.task_code||TASK_CODE));}
    function addScan(e){
      if(!e||!e.nr) return;
      if(e.task_version&&e.task_version!==TASK_VERSION) return;
      if(e.task_code&&e.task_code!==TASK_CODE) return;
      if(e.device_id&&deviceId&&String(e.device_id)!==String(deviceId)) return;
      if(e.employee&&employeeName&&normPerson(e.employee)!==normPerson(employeeName)) return;
      const k=keyOf(e); if(seen.has(k)) return; seen.add(k);
      const nr=normNr(e.nr);
      const d=e.data||dataMap.get(nr)||null;
      scanLog.push(Object.assign({},e,{nr:nr,data:d,hit:!!(e.hit||d),task_version:e.task_version||TASK_VERSION,task_code:e.task_code||TASK_CODE,device_id:e.device_id||deviceId,employee:e.employee||employeeName}));
    }
    const s=localStorage.getItem(scansStorageKey());
    if(s){
      const saved=JSON.parse(s);
      saved.forEach(addScan);
    }
    loadOutbox().forEach(addScan);
    scanLog.sort((a,b)=>String(b.ts||'').localeCompare(String(a.ts||'')));
    scannedNrs.clear();
    scanLog.forEach(e=>{if(e.nr) scannedNrs.set(e.nr,(scannedNrs.get(e.nr)||0)+1);});
    renderLog();
  }catch(_){}
}

// Sync to server
function scheduleSync(){
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(syncToServer,8000);
}
function syncToServer(){
  if(!deviceId) return;
  let pending=loadOutbox();
  const alreadySynced=localStorage.getItem('oos_synced_'+TASK_VERSION)==='1';
  if(!pending.length&&scanLog.length&&!alreadySynced){
    pending=scanLog.slice().reverse().map(e=>({id:e.id||'',nr:e.nr,dup:!!e.dup,hit:!!e.data,ts:e.ts||'',task_version:e.task_version||TASK_VERSION,task_code:e.task_code||TASK_CODE,device_id:e.device_id||deviceId,employee:e.employee||employeeName,timer_session_id:e.timer_session_id||timerSessionId,timer_boot_id:e.timer_boot_id||TIMER_BOOT_ID,elapsed_ms:e.elapsed_ms||elapsedMs()}));
  }
  if(!pending.length) return;
  if(!SERVER){
    syncToPublic(pending);
    return;
  }
  fetch(SERVER+'/worker/scan-report',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({device_id:deviceId,employee:employeeName,task_version:TASK_VERSION,task_code:TASK_CODE,timer_session_id:timerSessionId,timer_boot_id:TIMER_BOOT_ID,elapsed_ms:elapsedMs(),source:'local',scans:pending})
  }).then(r=>r.json()).then(d=>{
    if(d&&d.ack_ids) ackOutbox(d.ack_ids);
    setSyncStatus('synced · '+new Date().toLocaleTimeString(),true);
    logTerminalEvent('sync_ok',{sent:pending.length,accepted:d&&d.accepted,received:d&&d.received,closed:!!(d&&d.closed)});
    try{localStorage.setItem('oos_synced_'+TASK_VERSION,'1');}catch(_){}
  }).catch(()=>{
    logTerminalEvent('sync_offline',{sent:pending.length});
    syncToPublic(pending);
  });
}

function publicSyncEndpoint(path){
  if(!PUBLIC_SYNC_URL) return '';
  return String(PUBLIC_SYNC_URL).replace(/\/+$/,'')+'/'+String(path||'').replace(/^\/+/, '');
}
function syncToPublic(pending){
  if(!PUBLIC_SYNC_URL||!pending||!pending.length){
    setSyncStatus('offline – zapisano lokalnie',false);
    return;
  }
  const payload={
    token:PUBLIC_SYNC_TOKEN,
    shift_id:SHIFT_ID,
    device_id:deviceId,
    employee:employeeName,
    task_version:TASK_VERSION,
    task_code:TASK_CODE,
    timer_session_id:timerSessionId,
    timer_boot_id:TIMER_BOOT_ID,
    elapsed_ms:elapsedMs(),
    source:'public_sync',
    scans:pending,
    events:loadJournal().slice(-2000)
  };
  fetch(publicSyncEndpoint('/push'),{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  }).then(r=>r.json()).then(d=>{
    if(d&&d.ok){
      const ids=(d.ack_ids&&d.ack_ids.length)?d.ack_ids:pending.map(e=>e.id).filter(Boolean);
      ackOutbox(ids);
      setSyncStatus('public sync · '+new Date().toLocaleTimeString(),true);
      logTerminalEvent('public_sync_ok',{sent:pending.length,batch_id:d.batch_id||''});
      try{localStorage.setItem('oos_synced_'+TASK_VERSION,'1');}catch(_){}
      return;
    }
    throw new Error((d&&d.error)||'public sync rejected');
  }).catch(err=>{
    logTerminalEvent('public_sync_offline',{sent:pending.length,error:String(err&&err.message||err||'')});
    setSyncStatus('offline – zapisano lokalnie',false);
  });
}

// Version check
function checkVersion(){
  if(!SERVER) return;
  const url=SERVER+'/worker/version'+(deviceId?'?device_id='+encodeURIComponent(deviceId):'');
  fetch(url).then(r=>r.json()).then(d=>{
    setSyncStatus('online',true);
    logTerminalEvent('version_ok',{status:d.status||'active',task_version:d.task_version||'',task_code:d.task_code||'',server_time:d.server_time||''});
    if(d.status==='finished'||d.status==='paused'){
      if(d.status==='finished'){try{localStorage.setItem('oos_finished_'+deviceId,'1');}catch(_){}}
      showBlocked(d.status);
      return;
    }
    if(d.status==='active'){try{localStorage.removeItem('oos_finished_'+deviceId);}catch(_){}}
    if(!d.task_version){
      try{localStorage.setItem('oos_finished_'+deviceId,'1');}catch(_){}
      showBlocked('finished');
      return;
    }
    if(deviceId&&localStorage.getItem('oos_finished_'+deviceId)==='1'){
      showBlocked('finished');
      return;
    }
    sayHello(false);
    if((d.task_version&&d.task_version!==TASK_VERSION)||(d.task_code&&d.task_code!==TASK_CODE)){
      logTerminalEvent('new_task_available',{current_version:d.task_version||'',current_code:d.task_code||''});
      document.getElementById('newBanner').style.display='flex';
    }
  }).catch(()=>{logTerminalEvent('version_offline',{});setSyncStatus('offline',false);});
}
function reloadTask(){
  logTerminalEvent('reload_task',{from_version:TASK_VERSION,from_code:TASK_CODE});
  syncToServer();
  setTimeout(()=>{
    const url=SERVER+'/worker'+(deviceId?'?device_id='+encodeURIComponent(deviceId):'');
    window.location.href=url;
  },1000);
}

function exportSourceRows(){
  const byKey=new Map();
  function add(row){
    if(!row) return;
    const kind=row.kind||'scan';
    const key=row.id?kind+'|'+row.id:kind+'|'+(row.nr||row.event||'')+'|'+(row.ts||'')+'|'+(row.task_version||'')+'|'+(row.task_code||'');
    if(!byKey.has(key)) byKey.set(key,Object.assign({kind:kind},row));
  }
  loadJournal().forEach(add);
  loadOutbox().forEach(e=>add(Object.assign({kind:'scan'},e)));
  scanLog.forEach(e=>add({kind:'scan',id:e.id||'',nr:e.nr,dup:!!e.dup,hit:!!e.data,ts:e.ts||'',task_version:e.task_version||TASK_VERSION,task_code:e.task_code||TASK_CODE,device_id:e.device_id||deviceId,employee:e.employee||employeeName,timer_session_id:e.timer_session_id||timerSessionId,timer_boot_id:e.timer_boot_id||TIMER_BOOT_ID,elapsed_ms:e.elapsed_ms||elapsedMs()}));
  return Array.from(byKey.values()).sort((a,b)=>String(a.ts||'').localeCompare(String(b.ts||'')));
}

function encodeDetails(v){
  try{return encodeURIComponent(JSON.stringify(v||{}));}catch(_){return '%7B%7D';}
}

function requestFullExport(){
  const pass=prompt('Hasło eksportu: wpisz kod zadania');
  if(pass===null) return;
  if(String(pass).trim()!==String(TASK_CODE).trim()){
    alert('Błędny kod');
    return;
  }
  doExport();
}

function setupCodeExport(){
  const box=document.getElementById('taskCodeBox');
  if(!box) return;
  let timer=null;
  let fired=false;
  function start(e){
    fired=false;
    if(e&&e.type==='touchstart') e.preventDefault();
    clearTimeout(timer);
    timer=setTimeout(()=>{fired=true;requestFullExport();},1200);
  }
  function stop(){
    clearTimeout(timer);
  }
  box.addEventListener('mousedown',start);
  box.addEventListener('touchstart',start,{passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>box.addEventListener(ev,stop));
  box.addEventListener('click',e=>{if(fired)e.preventDefault();});
}

// Hidden manual export: long press the task code, then enter the task code again.
function doExport(){
  logTerminalEvent('manual_export',{trigger:'task_code_long_press'});
  let rows=exportSourceRows();
  if(!rows.length){alert('Brak zapisów do eksportu');return;}
  const lines=rows.map(e=>{
    if((e.kind||'scan')==='event'){
      return '@EVENT|'+(e.event||'event')+'|'+(e.ts||'')+'|'+(e.task_version||TASK_VERSION)+'|'+(e.task_code||TASK_CODE)+'|'+(e.id||'')+'|'+(e.employee||employeeName)+'|'+(e.device_id||deviceId)+'|'+(e.timer_session_id||timerSessionId)+'|'+(e.timer_boot_id||TIMER_BOOT_ID)+'|'+(e.elapsed_ms||0)+'|'+encodeDetails(e.details||{});
    }
    return e.nr+'|'+(e.ts||'')+'|'+(e.dup?'DUP':(e.hit?'HIT':'MISS'))+'|'+(e.task_version||TASK_VERSION)+'|'+(e.task_code||TASK_CODE)+'|'+(e.id||'')+'|'+(e.employee||employeeName)+'|'+(e.device_id||deviceId)+'|'+(e.timer_session_id||timerSessionId)+'|'+(e.timer_boot_id||TIMER_BOOT_ID)+'|'+(e.elapsed_ms||0);
  }).join('\n');
  const header=deviceId+'|'+employeeName+'|mixed|'+TASK_CODE+'|OOS_EXPORT_V2|'+new Date().toISOString();
  const txt=header+'\n'+lines;
  const el=document.getElementById('exportText');
  el.value=txt; el.style.display='block'; el.select();
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));
    a.download='oos_terminal_'+(deviceId||'terminal')+'_'+TASK_CODE+'.txt';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    alert('Eksport offline gotowy: '+rows.length+' zapisów');
  }catch(_){}
}

// Init
setupCodeExport();
registerOfflineCache();
loadLocal();
if(!scanLog.length) renderTable(false);
if(deviceId&&localStorage.getItem('oos_finished_'+deviceId)==='1'){
  document.getElementById('finishedOverlay').style.display='flex';
  sayHello(false);checkVersion();
} else if(deviceId){sayHello(false);checkVersion();}
document.body.addEventListener('click',()=>scanInput.focus());
window.onload=()=>scanInput.focus();
window.addEventListener('pagehide',()=>logTerminalEvent('page_hide',{}));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){logTerminalEvent('page_hidden',{});}
  else {logTerminalEvent('page_visible',{});checkVersion();syncToServer();}
});
setInterval(checkVersion,15000);
setInterval(syncToServer,120000);
</script>
