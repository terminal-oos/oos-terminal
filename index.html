  const p = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  const x = p(a), y = p(b);

}

const CH = 100;

  } catch (_) {}
}

}

$('inName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('inTerm').focus(); } });

$('user').addEventListener('click', () => { if (started) return; logEvent('user_change_open', {}); openStart(); });
function encodeDetails(v) {

}
function exportRows() {
  const m = new Map();
  function add(e) {
    if (!e) return;
    const k = (e.kind || 'scan') + '|' + (e.id || ((e.nr || e.event || '') + '|' + (e.ts || '')));

function toLocal(iso) {
