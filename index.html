  if (navigator.onLine === false) { el.textContent = 'OFFLINE - dziala, dane lokalnie'; el.className = 'off'; }
  else { el.textContent = 'online'; el.className = ''; }
}
window.addEventListener('online', () => { showNet(); logEvent('net_online', {}); syncTime(); });
setInterval(syncTime, 1800000); setTimeout(syncTime, 1500);
window.addEventListener('offline', () => { showNet(); logEvent('net_offline', {}); });
window.addEventListener('pagehide', () => { logEvent('page_hide', {}); flushJournal(); });
document.addEventListener('visibilitychange', () => {
  logEvent(document.hidden ? 'page_hidden' : 'page_visible', {});
  if (document.hidden) flushJournal(); else { getWake(); setTimeout(keepFocus, 50); }
});
setupCodeExport();
loadLocal();
showNet();
showUser();
showIdle();
updateCounters(false);
logEvent('page_open', {href: location.href, ua: navigator.userAgent || '', build: 'v18'});
logEvent('task_loaded', {total: DATA.length, unique: byNr.size});
try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (_) {}
let resumed = false;
try { resumed = !!(employeeName && terminalId && localStorage.getItem('oos_started_' + taskCode)); } catch (_) {}
if (resumed) {
  started = true; startEl.style.display = 'none'; showUser();
  logEvent('session_resume', {}); keepFocus();
} else { openStart(); }
</script>
